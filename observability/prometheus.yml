global:
  scrape_interval: 15s

scrape_configs:
  - job_name: os-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["os-service:8081"]

  - job_name: billing-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["billing-service:8082"]

  - job_name: execution-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["execution-service:8083"]
